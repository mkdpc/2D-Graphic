<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2D Graphic · DPC 工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9edf1; --panel:#fff; --ink:#15202b; --muted:#5b6977; --line:#d3dae1;
    --accent:#7c3aed; --accent2:#d63a6f; --soft:#f3f6f8;
    --f-display:"Archivo","Noto Sans TC",system-ui,sans-serif;
    --f-body:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
    display:grid;place-items:center;padding:28px;
  }
  .wrap{width:min(920px,100%)}
  header{margin-bottom:26px}
  h1{font:700 30px/1.25 var(--f-display);margin:0 0 8px;letter-spacing:.01em}
  header p{margin:0;color:var(--muted);font-size:13.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{
    display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:24px 24px 20px;text-decoration:none;color:inherit;
    transition:border-color .15s,transform .15s,box-shadow .15s;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 26px rgba(21,32,43,.10)}
  .card.b:hover{border-color:var(--accent2)}
  .ic{
    width:44px;height:44px;border-radius:9px;display:grid;place-items:center;margin-bottom:16px;
    background:#f1ecfe;color:var(--accent);
  }
  .card.b .ic{background:#fdecf2;color:var(--accent2)}
  .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  h2{font:700 18px/1.3 var(--f-display);margin:0 0 6px}
  .card p{margin:0 0 20px;color:var(--muted);font-size:13.5px;flex:1}
  .go{
    display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    background:var(--accent);color:#fff;border-radius:6px;padding:8px 16px;font-size:13.5px;font-weight:500;
  }
  .card.b .go{background:var(--accent2)}
  @media(max-width:720px){.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style>

<div class="wrap">
  <header>
    <h1>DPC 2D 工具</h1>
    <p>選擇要進行的作業。所有檔案都在瀏覽器內處理，不會上傳到任何伺服器。</p>
  </header>

  <div class="grid">
    <a class="card" href="pattern.html">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6"/><path d="M8 14h8M8 17h5"/></svg></span>
      <h2>版片 PNG 匯出器</h2>
      <p>從 DXF ＋ RUL 直接產出版片 PNG，不必經過 3D 軟體。</p>
      <span class="go">開始匯出 →</span>
    </a>

    <a class="card b" href="placement.html">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 6l4-3 5 2 5-2 4 3v13l-4 2-5-2-5 2-4-2z"/><circle cx="12" cy="10" r="2.6"/><path d="M12 13v5"/></svg></span>
      <h2>印圖定位產生器</h2>
      <p>填入跳檔數字，自動產出全尺碼定位圖與標註。</p>
      <span class="go">開始定位 →</span>
    </a>
  </div>

</div>
