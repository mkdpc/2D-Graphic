<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2D Graphic · DPC 工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232f2f2d'/%3E%3Ctext x='16' y='21.5' font-size='13' text-anchor='middle' fill='%23fafaf7' font-family='Georgia,serif' letter-spacing='1'%3E2D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf7; --ink:#2f2f2d; --muted:#8c8a85; --line:#e4e2dd; --soft:#f3f2ee;
    --serif:"Cormorant Garamond","Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;
    --sans:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.8 var(--sans);letter-spacing:.03em;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  ::selection{background:#e6e2d9}
  .top{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:baseline;padding:28px 60px;border-bottom:1px solid var(--line)}
  .brand{font:400 20px/1 var(--serif);letter-spacing:.28em}
  .top small{color:var(--muted);font-size:11px;letter-spacing:.18em}
  main{flex:1;width:min(1040px,100%);margin:0 auto;padding:80px 60px 60px}
  .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:56px}
  h1{font:400 15px/1 var(--serif);letter-spacing:.24em;margin:0}
  .head p{margin:0;color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
  .card{display:flex;flex-direction:column;padding:40px 36px 36px 0;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
  .card+.card{padding-left:36px;border-left:1px solid var(--line)}
  .no{font:400 32px/1 var(--serif);color:var(--muted);margin-bottom:28px}
  h2{font:400 21px/1.4 var(--serif);letter-spacing:.16em;margin:0 0 12px}
  .card p{margin:0 0 32px;color:var(--muted);font-size:13px;flex:1}
  .go{align-self:flex-start;font-size:12px;letter-spacing:.2em;border-bottom:1px solid transparent;transition:border-color .2s}
  .go::before{content:"( "}.go::after{content:" )"}
  .card:hover .go{border-color:var(--ink)}
  .card:hover h2{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
  footer{padding:24px 60px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;letter-spacing:.14em}
  @media(max-width:760px){
    .top,main,footer{padding-left:24px;padding-right:24px}
    main{padding-top:48px}.head{flex-direction:column;gap:12px}
    .grid{grid-template-columns:1fr}.card+.card{padding-left:0;border-left:0}
  }
  /* v14 標題加強 */
  .brand{font-weight:500;font-size:22px;color:#1f1f1d}
  h1{font:700 18px/1 var(--serif);letter-spacing:.14em;color:#1f1f1d}
  .no{color:#1f1f1d;font-size:36px;font-weight:500}
  h2{font:700 24px/1.4 var(--serif);letter-spacing:.1em;color:#1f1f1d}
  .go{font-weight:700;color:#1f1f1d}

/* v16 共用導覽列（三頁一致） */
.toolnav{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;font:500 12px/1.6 "Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;letter-spacing:.1em}
.toolnav a{color:#8c8a85;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px;white-space:nowrap}
.toolnav a:hover{color:#1f1f1d;border-bottom-color:#1f1f1d}
.toolnav a[aria-current=page]{color:#1f1f1d;font-weight:700;border-bottom-color:#1f1f1d}
.toolnav .home::before{content:"( "}.toolnav .home::after{content:" )"}
.toolnav .no{font-family:"Cormorant Garamond","Microsoft JhengHei",serif;font-size:14px;font-weight:500;margin-right:6px;letter-spacing:0}
</style>

<div class="top">
  <span class="brand">DPC</span>
  <nav class="toolnav" aria-label="工具切換"><a href="pattern.html"><span class="no">01</span>版片 PNG 匯出器</a><a href="placement.html"><span class="no">02</span>印圖定位產生器</a></nav>
</div>

<main>
  <div class="head">
    <h1>2D 工具</h1>
    <p>所有檔案都在瀏覽器內處理，不會上傳到任何伺服器。</p>
  </div>

  <div class="grid">
    <a class="card" href="pattern.html">
      <span class="no">01</span>
      <h2>版片 PNG 匯出器</h2>
      <p>從 DXF ＋ RUL 直接產出版片 PNG，不必經過 3D 軟體；可一鍵送到印圖定位產生器。</p>
      <span class="go">開始匯出</span>
    </a>
    <a class="card" href="placement.html">
      <span class="no">02</span>
      <h2>印圖定位產生器</h2>
      <p>定好基碼位置後，依品牌規範自動帶入跳檔參考值，再逐碼微調，產出全尺碼定位圖與標註。</p>
      <span class="go">開始定位</span>
    </a>
  </div>
</main>

<footer>DPC · 2D GRAPHIC</footer>
